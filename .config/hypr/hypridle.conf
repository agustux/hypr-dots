general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = $HOME/.config/hypr/scripts/dpms.sh on
    inhibit_sleep = 3 # hyprland has to wait till session locked to suspend
}

listener {
    timeout = 60                                # 1min.
    on-timeout = brightnessctl -s set 1          # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 60 # 1min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 90 # 1.5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 95 # 2min
    on-timeout = $HOME/.config/hypr/scripts/dpms.sh off
    on-resume = $HOME/.config/hypr/scripts/dpms.sh on
}

listener {
    timeout = 180 # 3min
    on-timeout = for f in /sys/class/power_supply/*/type; do [ "$(cat $f)" = Mains ] && [ "$(cat ${f%type}online)" = 1 ] && exit; done; systemctl suspend # suspend pc
}
